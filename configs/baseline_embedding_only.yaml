# Baseline: só camada de embedding (FairytaleQA pt-BR, amostra local para CI rápido).
seed: 42
orchestration: unico
output_dir: outputs

dataset:
  name: fairytale_ptbr
  subset: default
  split: validation
  reference_type: lexical
  hf_repo: null
  limit: 2
  mode: amostra_local

rag:
  enabled: true
  top_k: 4
  inject_retrieval_failure: false
  chunk_max_chars: 500

embeddings:
  backend: sentence_transformers
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

verification:
  verify_gold: false
  verify_embedding: true
  verify_judge: false
  embedding_min_cosine: 0.24
  negative_judge_verdicts:
    - nao_sustentado
    - contradicacao
    - inseguro

generation:
  temperature: 0.2
  max_tokens: 256
  estilo_prompt: rag_pt

llm:
  timeout_seconds: 60

aggregation:
  policy: qualquer_critico

baselines:
  profile: so_embeddings

metricas_lexicas:
  habilitado: true
  f1_token: true
