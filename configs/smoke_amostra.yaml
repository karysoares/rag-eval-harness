# Smoke offline: 2 itens pt-BR, sem Hub (mesmos prompts que FairytaleQA).
# Uso: uv run llm-eval --config configs/smoke_amostra.yaml

seed: 42
orchestration: unico
output_dir: outputs

dataset:
  name: fairytale_ptbr_smoke
  subset: default
  split: validation
  reference_type: lexical
  hf_repo: null
  hf_subset: null
  question_column: question
  answer_column: answer
  context_column: story_section
  incorrect_column: null
  id_column: null
  limit: 2
  mode: amostra_local

rag:
  enabled: true
  top_k: 4
  inject_retrieval_failure: false
  chunk_max_chars: 500
  min_score_recuperacao: 0.25

embeddings:
  backend: sentence_transformers
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

verification:
  verify_gold: false
  verify_embedding: true
  verify_judge: true
  embedding_min_cosine: 0.24
  embedding_use_gold_chunk: true
  judge_prompt_style: rag_pt
  judge_return_chain_of_thought: false
  judge_max_context_chars: 12000
  judge_max_parse_retries: 2
  negative_judge_verdicts:
    - nao_sustentado
    - contradicacao
    - inseguro
    - incompleto

generation:
  temperature: 0.2
  max_tokens: 256
  estilo_prompt: rag_pt
  omitir_llm_se_recuperacao_fraca: true

llm:
  timeout_seconds: 90

aggregation:
  policy: embedding_e_juiz

baselines:
  profile: hibrido

metricas_lexicas:
  habilitado: true
  f1_token: true
  bleu: false
  rouge_l: true
  meteor: false
  levenshtein: false
  modo_referencia: max_rouge_l

patterns:
  referencia_forte:
    f1_min: 0.65
  referencia_fraca:
    f1_min: 0.25
