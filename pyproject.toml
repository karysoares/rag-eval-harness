[project]
name = "rag-eval-harness"
version = "1.0.0"
description = "rag-eval-harness — harness reprodutível para avaliação de pipelines RAG + LLM: recuperação, geração, grounding, juiz e padrões determinísticos, com dashboard offline e artefactos auditáveis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "datasets>=3.0.0,<4",
    "httpx>=0.27.0,<1",
    "nltk>=3.8.0,<4",
    "numpy>=1.26.0,<3",
    "python-dotenv>=1.0.0,<2",
    "pyyaml>=6.0.1,<7",
    "rapidfuzz>=3.0.0,<4",
    "rouge-score>=0.1.2,<1",
    "sacrebleu>=2.4.0,<3",
    "sentence-transformers>=3.0.0,<5",
]

[project.scripts]
llm-eval = "llm_evaluation.cli:main"
llm-eval-dashboard = "llm_evaluation.dashboard.launch:main"

[project.optional-dependencies]
ragas = [
    "ragas>=0.2.0,<1",
    "langchain-openai>=0.2.0,<1",
]
dev = [
    "mypy>=1.11.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.8.0,<1",
    "types-PyYAML>=6.0.12.20241221",
]
notebook = [
    "ipykernel>=6.29.0,<7",
    "jupyter>=1.1.0,<2",
    "matplotlib>=3.8.0,<4",
    "pandas>=2.2.0,<3",
]
dashboard = [
    "pandas>=2.2.0,<3",
    "plotly>=5.24.0,<6",
    "streamlit>=1.40.0,<2",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_evaluation = ["py.typed", "prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["llm_evaluation"]

[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rouge_score", "rouge_score.*", "sacrebleu", "sacrebleu.*", "nltk", "nltk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "plotly", "plotly.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llm_evaluation.benchmarks.ragas_adapter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls external APIs (requires secrets)",
]

[tool.coverage.run]
omit = [
    "*/dashboard/app.py",
    "*/dashboard/launch.py",
]
