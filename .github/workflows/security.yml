name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Export requirements
        # --no-emit-project: sem isto o export inclui `-e .` e o pip-audit aborta
        # com "cannot be installed when requiring hashes" antes de auditar seja o que for.
        run: uv export --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        # Informativo, não bloqueante. Os achados actuais são transitivos de
        # sentence-transformers/datasets e as correcções estão fora do alcance dos
        # nossos limites de versão (`sentence-transformers<5` prende transformers em
        # 4.x; `datasets<4` prende a correcção que só existe em 5.0.1). Três avisos
        # não têm correcção publicada, por isso "zero achados" não é alcançável hoje.
        # Subir estes limites é uma migração de majors com risco para os embeddings
        # e merece o seu próprio ciclo de verificação — ver a issue de dívida técnica.
        continue-on-error: true
        run: |
          pipx run pip-audit -r requirements-audit.txt --strict || {
            echo "::warning::pip-audit encontrou vulnerabilidades — ver issue de dívida de dependências";
            exit 1;
          }
